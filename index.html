<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Bicycle Overtake Radar</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .dashboard {
      width: 100%;
      max-width: 500px;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 15px;
      background: #0a0a0a;
      box-sizing: border-box;
    }
    h1 {
      font-size: 1.2rem;
      margin-top: 0;
      text-align: center;
      border-bottom: 1px solid #222;
      padding-bottom: 10px;
    }
    .metric {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed #111;
    }
    .metric-label { color: #888; font-size: 0.9rem; }
    .metric-value { font-weight: bold; font-family: monospace; }
    .alert-matrix {
      background: #111;
      padding: 12px;
      text-align: center;
      font-weight: bold;
      border-radius: 4px;
      margin: 15px 0;
      border: 1px solid #333;
    }
    .btn-track {
      width: 100%;
      background: #007bff;
      color: white;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-track:active { background: #0056b3; }
    .footer-status {
      text-align: center;
      font-size: 0.7rem;
      color: #444;
      margin-top: 15px;
    }
  </style>
  <!-- Load local verified core bundle -->
  <script src="./js/vision_bundle.js"></script>
</head>
<body>

  <div class="dashboard">
    <h1>🚲 AI Overtake Radar Dashboard</h1>
    
    <div class="metric">
      <span class="metric-label" id="stream-status">Searching for Bicycle Camera... STREAM CLOSED</span>
    </div>
    
    <div class="metric">
      <span class="metric-label">Target Tracked:</span>
      <span class="metric-value" id="val-target">NONE</span>
    </div>
    
    <div class="metric">
      <span class="metric-label">Calculated IoU:</span>
      <span class="metric-value" id="val-iou">0.00</span>
    </div>
    
    <div class="metric">
      <span class="metric-label">Time-to-Collision:</span>
      <span class="metric-value" id="val-ttc">Infinity</span>
    </div>
    
    <div class="alert-matrix" id="alert-display" style="color: #0f0;">
      Alert Matrix: CLEAR
    </div>

    <button class="btn-track" id="btn-launch">Launch AI Tracking</button>

    <!-- SYSTEM LOG PANEL -->
    <div id="mobile-debug-console" style="background: #111; color: #0f0; font-family: monospace; font-size: 11px; padding: 10px; margin-top: 15px; border: 2px solid #333; height: 150px; overflow-y: scroll; border-radius: 4px; box-sizing: border-box;">
      <div style="border-bottom: 1px solid #333; padding-bottom: 4px; margin-bottom: 4px; color: #888; display: flex; justify-content: space-between; font-weight: bold;">
        <span>📱 SYSTEM ENGINE LOGS (Galaxy A36 ADAS)</span>
        <button onclick="document.getElementById('debug-log-out').innerHTML=''" style="background:#222; color:#fff; border:1px solid #444; font-size:9px; cursor:pointer; padding:1px 4px;">Clear</button>
      </div>
      <div id="debug-log-out"></div>
    </div>

    <div class="footer-status">
      OFFLINE MODE: CONNECT TO BIKE-RADAR-STEM WI-FI | v.4.2.0-FixedAssets
    </div>
  </div>

  <script>
    let objectDetector;
    const output = document.getElementById('debug-log-out');

    // Inline logging setup
    function formatLog(args, color) {
      const msg = Array.from(args).map(arg => typeof arg === 'object' ? JSON.stringify(arg) : arg).join(' ');
      const line = document.createElement('div');
      line.style.color = color;
      line.style.marginBottom = '4px';
      line.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
      output.appendChild(line);
      output.scrollTop = output.scrollHeight;
    }

    console.log = function() { formatLog(arguments, '#0f0'); };
    console.error = function() { formatLog(arguments, '#f33'); };
    console.warn = function() { formatLog(arguments, '#ff0'); };

    window.addEventListener('error', e => formatLog([`CRITICAL: ${e.message}`], '#f0f'));
    window.addEventListener('unhandledrejection', e => formatLog([`PROMISE REJECTION: ${e.reason}`], '#f0f'));

    console.log("Visual telemetry active. Clean asset mode running.");

    // Initializing MediaPipe Object Detector using the Engineer's exact parameters
    async function initializeDetector() {
      try {
        console.log("Initializing tracking loop...");
        console.log("Forcing runtime optimization constraints: delegate: CPU");
        
        // Pointing explicitly to our local, uncorrupted WebAssembly binary directory
        const vision = await FilesetResolver.forVisionTasks("./wasm");
        
        objectDetector = await ObjectDetector.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: "./models/efficientdet_lite0.tflite",
            delegate: "CPU" // Hardcoded CPU preference to stop WebGPU crashes entirely
          },
          scoreThreshold: 0.3,
          runningMode: "IMAGE"
        });

        console.log("SUCCESS: LiteRT CPU Engine instantiated cleanly!");
        document.getElementById('stream-status').innerText = "Bicycle Camera Interface: ACTIVE";
      } catch (err) {
        console.error("Initialization Failed: " + err.message);
      }
    }

    document.getElementById('btn-launch').addEventListener('click', () => {
      initializeDetector();
    });
  </script>
</body>
</html>

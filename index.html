<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Bicycle Overtake Radar Dashboard</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .dashboard-container {
            width: 100%;
            max-width: 480px;
            background: #111;
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            border: 1px solid #222;
        }
        h1 {
            font-size: 1.4rem;
            margin-top: 0;
            text-align: center;
            color: #fff;
        }
        .metric-box {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .metric-label {
            font-size: 0.9rem;
            color: #aaa;
        }
        .metric-value {
            font-size: 1.1rem;
            font-weight: bold;
            font-family: monospace;
        }
        .btn-tracking {
            display: block;
            width: 100%;
            background: #0076ff;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .btn-tracking:active {
            background: #0056b3;
        }
        .status-footer {
            font-size: 0.75rem;
            color: #666;
            text-align: center;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <h1>🚲 AI Overtake Radar Dashboard</h1>
    
    <div class="metric-box">
        <span class="metric-label">Searching for Bicycle Camera...</span>
        <span class="metric-value" style="color: #ff9500;">STREAM CLOSED</span>
    </div>

    <div class="metric-box">
        <span class="metric-label">Target Tracked:</span>
        <span class="metric-value" id="target-tracked">NONE</span>
    </div>

    <div class="metric-box">
        <span class="metric-label">Calculated IoU:</span>
        <span class="metric-value" id="calculated-iou">0.00</span>
    </div>

    <div class="metric-box">
        <span class="metric-label">Time-to-Collision:</span>
        <span class="metric-value" id="ttc-value">Infinity</span>
    </div>

    <div class="metric-box">
        <span class="metric-label">Alert Matrix:</span>
        <span class="metric-value" id="alert-matrix" style="color: #34c759;">CLEAR</span>
    </div>

    <!-- Activation Button Trigger -->
    <button class="btn-tracking" id="launch-btn" onclick="initAiTracking()">Launch AI Tracking</button>

    <!-- REAL-TIME MOBILE DEBUGGING CONSOLE -->
    <div id="mobile-debug-console" style="background: #111; color: #0f0; font-family: monospace; font-size: 11px; padding: 10px; margin-top: 15px; border: 2px solid #333; height: 150px; overflow-y: scroll; border-radius: 4px; box-sizing: border-box;">
      <div style="border-bottom: 1px solid #333; padding-bottom: 4px; margin-bottom: 4px; color: #888; display: flex; justify-content: space-between; font-weight: bold;">
        <span>📱 SYSTEM ENGINE LOGS (Galaxy A36 ADAS)</span>
        <button onclick="document.getElementById('debug-log-out').innerHTML=''" style="background:#222; color:#fff; border:1px solid #444; font-size:9px; cursor:pointer; padding:1px 4px; border-radius:2px;">Clear</button>
      </div>
      <div id="debug-log-out"></div>
    </div>

    <div class="status-footer">
        OFFLINE MODE: CONNECT TO BIKE-RADAR-STEM WI-FI | v.4.0.0-LiteRT
    </div>
</div>

<script>
  // Global Real-time Visual Log Capture Setup
  (function() {
    const output = document.getElementById('debug-log-out');
    function formatLog(args, color) {
      const msg = Array.from(args).map(arg => 
        typeof arg === 'object' ? JSON.stringify(arg) : arg
      ).join(' ');
      const line = document.createElement('div');
      line.style.color = color;
      line.style.marginBottom = '3px';
      line.style.borderBottom = '1px dashed #222';
      line.style.whiteSpace = 'pre-wrap';
      line.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
      output.appendChild(line);
      output.scrollTop = output.scrollHeight;
    }

    const _log = console.log;
    const _error = console.error;
    const _warn = console.warn;

    console.log = function() { formatLog(arguments, '#0f0'); _log.apply(console, arguments); };
    console.error = function() { formatLog(arguments, '#f33'); _error.apply(console, arguments); };
    console.warn = function() { formatLog(arguments, '#ff0'); _warn.apply(console, arguments); };

    window.addEventListener('error', function(e) {
      formatLog([`CRITICAL: ${e.message} at ${e.filename}:${e.lineno}`], '#f0f');
    });
    window.addEventListener('unhandledrejection', function(e) {
      formatLog([`PROMISE REJECTION: ${e.reason}`], '#f0f');
    });
    
    console.log("Visual debugger telemetry active. System running out of file:// sandbox context.");
  })();

  // Core Dummy AI Engine & Asset Loading Harness for Verification
  function initAiTracking() {
    console.log("Initializing tracking loop...");
    console.log("Loading runtime options via WebGPU/Wasm layers...");
    
    // Explicitly logging asset resolution paths to trap local sandbox limits
    console.log("Resolving local model link: models/efficientdet_lite0.tflite");
    console.log("Resolving WebAssembly wrapper: wasm/vision_wasm_internal.wasm");
    
    // Simulating the structural error hook for testing validation
    setTimeout(() => {
        console.error("AI ENGINE ERROR: Failed to instantiate WebGPU compilation context. Falling back to CPU / WebAssembly thread parsing.");
        console.warn("SANDBOX LIMITATION DETECTED: Relative file system paths ('file:///') block secure origin feature configuration inside mobile browser engine.");
        
        // Update dashboard telemetry safely to match system failure state
        document.getElementById('target-tracked').innerText = "ERROR_HALT";
        document.getElementById('target-tracked').style.color = "#ff3b30";
        document.getElementById('alert-matrix').innerText = "SYSTEM FAILURE";
        document.getElementById('alert-matrix').style.color = "#ff3b30";
    }, 800);
  }
</script>
</body>
</html>

<!DOCTYPE html>
<!-- 
  PROJECT: AI Bicycle Overtake Radar (STEM Safety)
  FILE: index.html (Main UI Dashboard)
  VERSION: 3.0.0-LocalAssets
  DATE: 2026-10-22
  CHANGELOG: Added visible version tracker to the status bar. Replaced all external CDN hooks with local horizontal directory paths (./wasm and ./js).
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Bicycle Overtake Radar</title>
    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Offline PWA Registered!'))
                    .catch(err => console.error('PWA Error:', err));
            });
        }
    </script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 15px; }
        h1 { color: #00e676; margin-bottom: 5px; }
        .radar-box { position: relative; width: 100%; max-width: 480px; margin: 0 auto; background: #000; border-radius: 12px; overflow: hidden; }
        #esp32-stream { width: 100%; height: auto; display: block; min-height: 240px; }
        #canvas-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #status-bar { padding: 12px; font-weight: bold; background: #2a2a2a; border-top: 1px solid #333; font-size: 16px; }
        .version-tag { font-size: 11px; color: #888; display: block; margin-top: 5px; font-weight: normal; }
        .safe { color: #00e676; }
        .danger { color: #ff1744; background: #4a000e; animation: flash 0.4s infinite alternate; }
        @keyframes flash { from { background: #4a000e; } to { background: #ff1744; } }
        button { background: #00e676; border: none; padding: 15px 30px; font-weight: bold; border-radius: 6px; margin-top: 15px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>
    <h1>🚲 AI Overtake Radar</h1>
    <div class="radar-box">
        <img id="esp32-stream" crossorigin="anonymous" src="http://192.168.4" alt="Searching for Bicycle Camera..." />
        <canvas id="canvas-overlay"></canvas>
        <div id="status-bar" class="safe">
            <span id="status-text">🟢 OFFLINE MODE: CONNECT TO BIKE-RADAR-STEM WI-FI</span>
            <!-- VISIBLE VERSION TEXT FOR STUDENTS AND TEACHERS -->
            <span class="version-tag">Dashboard Version: v3.0.0-LocalAssets</span>
        </div>
    </div>
    <button id="start-btn">Launch AI Tracking</button>

    <script src="js/vision_bundle.js"></script>
    <script>
        const streamImg = document.getElementById('esp32-stream');
        const canvas = document.getElementById('canvas-overlay');
        const ctx = canvas.getContext('2d');
        const statusBar = document.getElementById('status-bar');
        const statusText = document.getElementById('status-text');
        const startBtn = document.getElementById('start-btn');
        let objectDetector;
        let trackedVehicles = {}; 
        let vehicleIdCounter = 100; 
        const TTC_THRESHOLD = 2.5; 

        async function initAI() {
            try {
                const vision = await FilesetResolver.forVisionTasks("./wasm");
                objectDetector = await ObjectDetector.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: "./models/efficientdet_lite0.tflite",
                        delegate: "GPU"
                    },
                    scoreThreshold: 0.50,
                    runningMode: "VIDEO"
                });
                statusText.innerText = "🟢 RADAR ACTIVE: ROAD CLEAR";
            } catch (e) {
                statusText.innerText = "❌ AI ENGINE ERROR: REBOOT SYSTEM";
                console.error(e);
            }
        }

        function calculateIoU(boxA, boxB) {
            const xA = Math.max(boxA.originX, boxB.originX);
            const yA = Math.max(boxA.originY, boxB.originY);
            const xB = Math.min(boxA.originX + boxA.width, boxB.originX + boxB.width);
            const yB = Math.min(boxA.originY + boxA.height, boxB.originY + boxB.height);
            const interArea = Math.max(0, xB - xA) * Math.max(0, yB - yA);
            if (interArea === 0) return 0;
            const boxAArea = boxA.width * boxA.height;
            const boxBArea = boxB.width * boxB.height;
            return interArea / (boxAArea + boxBArea - interArea);
        }

        function processDetections(currentDetections) {
            const now = performance.now();
            let newTrackedVehicles = {};
            let globalDangerDetected = false;
            const validDetections = currentDetections.filter(det => ['car', 'truck', 'bus', 'motorcycle'].includes(det.categories.categoryName));
            
            validDetections.forEach(det => {
                const currentBox = det.boundingBox;
                const currentArea = currentBox.width * currentBox.height;
                let bestMatchId = null;
                let bestIoU = 0.3; 
                for (const id in trackedVehicles) {
                    const iou = calculateIoU(currentBox, trackedVehicles[id].box);
                    if (iou > bestIoU) { bestIoU = iou; bestMatchId = id; }
                }
                if (bestMatchId) {
                    const previousData = trackedVehicles[bestMatchId];
                    const timeDelta = (now - previousData.lastUpdated) / 1000; 
                    const areaDelta = currentArea - previousData.area; 
                    const expansionRate = timeDelta > 0 ? (areaDelta / timeDelta) : 0;
                    let ttc = Infinity; 
                    if (expansionRate > 0) { ttc = (2 * currentArea) / expansionRate; }
                    newTrackedVehicles[bestMatchId] = { box: currentBox, area: currentArea, lastUpdated: now, ttc: ttc, label: det.categories.categoryName };
                    if (ttc <= TTC_THRESHOLD) { globalDangerDetected = true; }
                } else {
                    vehicleIdCounter++;
                    newTrackedVehicles[vehicleIdCounter] = { box: currentBox, area: currentArea, lastUpdated: now, ttc: Infinity, label: det.categories.categoryName };
                }
            });
            trackedVehicles = newTrackedVehicles;
            return globalDangerDetected;
        }

        function detectFrame() {
            if (!objectDetector || !streamImg.complete) { requestAnimationFrame(detectFrame); return; }
            if (canvas.width !== streamImg.clientWidth) { canvas.width = streamImg.clientWidth; canvas.height = streamImg.clientHeight; }
            const detections = objectDetector.detectForVideo(streamImg, performance.now());
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const alertDriver = processDetections(detections.detections);
            for (const id in trackedVehicles) {
                const vehicle = trackedVehicles[id];
                const box = vehicle.box;
                ctx.strokeStyle = vehicle.ttc <= TTC_THRESHOLD ? "#ff1744" : "#00e676";
                ctx.lineWidth = 4;
                ctx.strokeRect(box.originX, box.originY, box.width, box.height);
                ctx.fillStyle = ctx.strokeStyle;
                ctx.font = "bold 14px sans-serif";
                const displayTTC = vehicle.ttc === Infinity ? "Calculating..." : vehicle.ttc.toFixed(1) + "s";
                ctx.fillText(`ID: ${id} [${vehicle.label}] TTC: ${displayTTC}`, box.originX, box.originY - 5);
            }
            if (alertDriver) {
                statusText.innerText = "⚠️ DANGER: VEHICLE OVERTAKE IN PROGRESS!";
                statusBar.className = "danger";
                if (navigator.vibrate) navigator.vibrate(200); 
            } else {
                statusText.innerText = "🟢 RADAR ACTIVE: ROAD CLEAR";
                statusBar.className = "safe";
            }
            requestAnimationFrame(detectFrame);
        }
        startBtn.addEventListener('click', () => { initAI().then(() => { detectFrame(); startBtn.style.display = 'none'; }); });
    </script>
</body>
</html>

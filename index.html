<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Bicycle Overtake Radar</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .dashboard {
      width: 100%;
      max-width: 500px;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 15px;
      background: #0a0a0a;
      box-sizing: border-box;
    }
    h1 {
      font-size: 1.2rem;
      margin-top: 0;
      text-align: center;
      border-bottom: 1px solid #222;
      padding-bottom: 10px;
    }
    .metric {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed #111;
    }
    .metric-label { color: #888; font-size: 0.9rem; }
    .metric-value { font-weight: bold; font-family: monospace; }
    .alert-matrix {
      background: #111;
      padding: 12px;
      text-align: center;
      font-weight: bold;
      border-radius: 4px;
      margin: 15px 0;
      border: 1px solid #333;
      transition: background 0.2s ease;
    }
    .btn-track {
      width: 100%;
      background: #007bff;
      color: white;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-track:active { background: #0056b3; }
    .footer-status {
      text-align: center;
      font-size: 0.7rem;
      color: #444;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <h1>🚲 AI Overtake Radar Dashboard</h1>
    
    <div class="metric">
      <span class="metric-label" id="stream-status">Searching for Bicycle Camera... STREAM CLOSED</span>
    </div>
    
    <div class="metric">
      <span class="metric-label">Target Tracked:</span>
      <span class="metric-value" id="val-target">NONE</span>
    </div>
    
    <div class="metric">
      <span class="metric-label">Calculated IoU:</span>
      <span class="metric-value" id="val-iou">0.00</span>
    </div>
    
    <div class="metric">
      <span class="metric-label">Time-to-Collision:</span>
      <span class="metric-value" id="val-ttc">Infinity</span>
    </div>
    
    <div class="alert-matrix" id="alert-display" style="color: #0f0;">
      Alert Matrix: CLEAR
    </div>

    <button class="btn-track" id="btn-launch">Launch AI Tracking</button>

    <!-- SYSTEM LOG PANEL -->
    <div id="mobile-debug-console" style="background: #111; color: #0f0; font-family: monospace; font-size: 11px; padding: 10px; margin-top: 15px; border: 2px solid #333; height: 150px; overflow-y: scroll; border-radius: 4px; box-sizing: border-box;">
      <div style="border-bottom: 1px solid #333; padding-bottom: 4px; margin-bottom: 4px; color: #888; display: flex; justify-content: space-between; font-weight: bold;">
        <span>📱 SYSTEM ENGINE LOGS (Galaxy A36 ADAS)</span>
        <button onclick="document.getElementById('debug-log-out').innerHTML=''" style="background:#222; color:#fff; border:1px solid #444; font-size:9px; cursor:pointer; padding:1px 4px;">Clear</button>
      </div>
      <div id="debug-log-out"></div>
    </div>

    <div class="footer-status">
      OFFLINE MODE: CONNECT TO BIKE-RADAR-STEM WI-FI | v.4.2.0-FixedAssets
    </div>
  </div>

  <!-- SINGLE MASTER APPLICATION MODULE -->
  <script type="module">
    import { FilesetResolver, ObjectDetector } from "./js/vision_bundle.js";

    let objectDetector;
    let streamElement = null;
    let isTrackingActive = false;
    let lastBoundingBox = null;
    let lastTimestamp = 0;

    const output = document.getElementById('debug-log-out');

    // Inline logging setup
    function formatLog(args, color) {
      const msg = Array.from(args).map(arg => typeof arg === 'object' ? JSON.stringify(arg) : arg).join(' ');
      const line = document.createElement('div');
      line.style.color = color;
      line.style.marginBottom = '4px';
      line.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
      output.appendChild(line);
      output.scrollTop = output.scrollHeight;
    }

    console.log = function() { formatLog(arguments, '#0f0'); };
    console.error = function() { formatLog(arguments, '#f33'); };
    console.warn = function() { formatLog(arguments, '#ff0'); };

    window.addEventListener('error', e => formatLog([`CRITICAL: ${e.message}`], '#f0f'));
    window.addEventListener('unhandledrejection', e => formatLog([`PROMISE REJECTION: ${e.reason}`], '#f0f'));

    console.log("Visual telemetry active. Clean asset mode running.");

    // Unified Initialization Engine using absolute WASM path resolution
    async function initializeDetector() {
      if (isTrackingActive) return;
      
      try {
        console.log("Initializing tracking loop...");
        console.log("Forcing runtime optimization constraints: delegate: CPU");
        
        const localWasmPath = `${window.location.origin}/wasm`;
        console.log("System Engine: Booting local assets from " + localWasmPath);
        
        const vision = await FilesetResolver.forVisionTasks(localWasmPath);
        console.log("System Engine: FilesetResolver successfully bound.");
        
        objectDetector = await ObjectDetector.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: "./models/efficientdet_lite0.tflite",
            delegate: "CPU"
          },
          scoreThreshold: 0.3,
          runningMode: "IMAGE"
        });

        console.log("SUCCESS: LiteRT CPU Engine instantiated cleanly!");
        
        // Setup the ESP32 Camera Stream Receiver Link
        setupCameraStream();
        
      } catch (err) {
        console.error("Initialization Failed: " + (err?.message || JSON.stringify(err) || "Unknown Asset Load Failure"));
      }
    }

    // Connects background DOM element to the default ESP32-CAM MJPEG server address
    function setupCameraStream() {
      console.log("Connecting to ESP32-CAM MJPEG stream at 192.168.4.1...");
      
      streamElement = new Image();
      streamElement.crossOrigin = "anonymous";
      
      // Hook up stream life cycle monitoring events
      streamElement.onload = () => {
        if (!isTrackingActive) {
          console.log("Stream sync verified. Starting processing frame loop.");
          document.getElementById('stream-status').innerText = "Bicycle Camera Interface: ACTIVE";
          isTrackingActive = true;
          requestAnimationFrame(processFrameLoop);
        }
      };

      streamElement.onerror = () => {
        console.error("Stream error: Failed to pull data from http://192.168.4.1:81/stream");
        document.getElementById('stream-status').innerText = "STREAM CORRUPTED / TARGET OFFLINE";
      };

      // Direct injection of default raw MJPEG port path assignment
      streamElement.src = "http://192.168.4.1:81/stream";
    }

    // High performance frame parsing loop 
    async function processFrameLoop(timestamp) {
      if (!isTrackingActive) return;

      try {
        // Execute fast sync vision slice inference
        const results = await objectDetector.detect(streamElement);
        
        // Look through detected items for threatening vehicles (car, truck, bus, motorcycle)
        const targetLabels = ['car', 'truck', 'bus', 'motorcycle'];
        const validThreats = results.detections.filter(d => 
          d.categories.some(c => targetLabels.includes(c.categoryName))
        );

        if (validThreats.length > 0) {
          // Sort to track the highest score or most immediate threat
          const threat = validThreats[0];
          const bestCategory = threat.categories[0];
          const box = threat.boundingBox;

          // Update UI target indicators
          document.getElementById("val-target").innerText = `${bestCategory.categoryName.toUpperCase()} (${Math.round(bestCategory.score * 100)}%)`;

          if (lastBoundingBox && lastTimestamp > 0) {
            const timeDelta = (timestamp - lastTimestamp) / 1000; // in seconds
            
            // 1. Calculate Intersection-over-Union (IoU) to evaluate structural changes
            const iou = calculateIoU(lastBoundingBox, box);
            document.getElementById("val-iou").innerText = iou.toFixed(2);

            // 2. Compute closing speed using scale factor differences as a relative baseline
            const currentSize = box.width * box.height;
            const lastSize = lastBoundingBox.width * lastBoundingBox.height;
            
            // Overlapping changes calculate structural scale adjustments
            if (currentSize > lastSize && timeDelta > 0) {
              const rateOfGrowth = (currentSize - lastSize) / lastSize / timeDelta;
              
              // 3. Extrapolate relative Time-to-Collision (TTC)
              const ttc = 1 / rateOfGrowth;
              document.getElementById("val-ttc").innerText = ttc < 0 ? "Infinity" : `${ttc.toFixed(1)}s`;

              // 4. Update the Alert Matrix system state
              updateAlertMatrix(ttc);
            } else {
              resetThreatMetricsOnly();
            }
          }

          lastBoundingBox = box;
          lastTimestamp = timestamp;
        } else {
          // Clear tracking parameters gracefully when view is unobstructed
          resetTrackingMetrics();
        }

      } catch (err) {
        console.warn("Frame parse warning:", err.message);
      }

      // Re-trigger loop on browser frame refresh
      requestAnimationFrame(processFrameLoop);
    }

    // Standard bounding box spatial mapping Intersection over Union math engine
    function calculateIoU(boxA, boxB) {
      const xA = Math.max(boxA.originX, boxB.originX);
      const yA = Math.max(boxA.originY, boxB.originY);
      const xB = Math.min(boxA.originX + boxA.width, boxB.originX + boxB.width);
      const yB = Math.min(boxA.originY + boxA.height, boxB.originY + boxB.height);

      const interWidth = Math.max(0, xB - xA);
      const interHeight = Math.max(0, yB - yA);
      const interArea = interWidth * interHeight;

      if (interArea === 0) return 0;

      const areaA = boxA.width * boxA.height;
      const areaB = boxB.width * boxB.height;
      return interArea / (areaA + areaB - interArea);
    }

    function updateAlertMatrix(ttc) {
      const display = document.getElementById("alert-display");
      if (ttc <= 2.5) {
        display.innerText = "🚨 CRITICAL OVERTAKE THREAT 🚨";
        display.style.color = "#fff";
        display.style.backgroundColor = "#ff0000";
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      } else if (ttc <= 5.0) {
        display.innerText = "⚠️ VEHICLE APPROACHING ⚠️";
        display.style.color = "#000";
        display.style.backgroundColor = "#ffcc00";
      } else {
        display.innerText = "Alert Matrix: CLEAR";
        display.style.color = "#0f0";
        display.style.backgroundColor = "#111";
      }
    }

    function resetThreatMetricsOnly() {
      document.getElementById("val-iou").innerText = "0.00";
      document.getElementById("val-ttc").innerText = "Infinity";
    }

    function resetTrackingMetrics() {
      document.getElementById("val-target").innerText = "NONE";
      document.getElementById("val-iou").innerText = "0.00";
      document.getElementById("val-ttc").innerText = "Infinity";
      
      const display = document.getElementById("alert-display");
      display.innerText = "Alert Matrix: CLEAR";
      display.style.color = "#0f0";
      display.style.backgroundColor = "#111";
      
      lastBoundingBox = null;
      lastTimestamp = 0;
    }

    // Attach click event to launch button
    document.getElementById('btn-launch').addEventListener('click', () => {
      initializeDetector();
    });
  </script>
</body>
</html>

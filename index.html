<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Bicycle Overtake Radar</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0f">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0a0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: relative;
            -webkit-user-select: none;
            user-select: none;
        }
        #dashboard-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            box-sizing: border-box;
        }
        #header {
            background: linear-gradient(180deg, #14141f 0%, #0a0a0f 100%);
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #222233;
            height: 55px;
            box-sizing: border-box;
        }
        h1 {
            margin: 0;
            font-size: 16px;
            letter-spacing: 0.5px;
            color: #eceff4;
        }
        #status-badge {
            display: inline-block;
            background: #ebcb8b;
            color: #0a0a0f;
            font-size: 9px;
            font-weight: bold;
            padding: 1px 6px;
            border-radius: 8px;
            margin-top: 2px;
            text-transform: uppercase;
        }
        #viewport-wrapper {
            width: 100%;
            height: 45vh;
            position: relative;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-sizing: border-box;
            border-bottom: 1px solid #222233;
        }
        #video-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #telemetry-overlay {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(10, 10, 15, 0.85);
            border: 1px solid #4c566a;
            border-radius: 4px;
            padding: 6px;
            font-family: monospace;
            font-size: 11px;
            pointer-events: none;
            z-index: 10;
        }
        .tel-row {
            margin-bottom: 3px;
        }
        .tel-val {
            color: #88c0d0;
            font-weight: bold;
        }
        #mobile-debug-console {
            width: 100%;
            height: 25vh;
            background: rgba(10, 10, 15, 0.98);
            color: #a3be8c;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            box-sizing: border-box;
            padding: 6px;
            border-bottom: 1px solid #222233;
            display: flex;
            flex-direction: column;
        }
        #mobile-debug-logs {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        #mobile-debug-logs div {
            margin-bottom: 2px;
            line-height: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            word-break: break-all;
        }
        #control-panel {
            flex: 1;
            background: #14141f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 12px;
            box-sizing: border-box;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
        }
        .btn {
            background: #5e81ac;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            max-width: 260px;
            box-sizing: border-box;
        }
        .btn:active {
            background: #4c566a;
        }
    </style>
</head>
<body>

<div id="dashboard-container">
    <div id="header">
        <h1>🚲 AI Overtake Radar Dashboard</h1>
        <div id="status-badge">Searching for Bicycle Camera...</div>
    </div>

    <div id="viewport-wrapper">
        <canvas id="video-canvas"></canvas>
        <div id="telemetry-overlay">
            <div class="tel-row">Target Tracked: <span id="hud-target" class="tel-val">NONE</span></div>
            <div class="tel-row">Calculated IoU: <span id="hud-iou" class="tel-val">0.00</span></div>
            <div class="tel-row">Time-to-Collision: <span id="hud-ttc" class="tel-val">Infinity</span></div>
            <div class="tel-row">Alert Matrix: <span id="hud-alert" class="tel-val" style="color:#a3be8c;">CLEAR</span></div>
        </div>
    </div>

    <div id="mobile-debug-console">
        <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #3b4252; padding-bottom: 2px; margin-bottom: 4px; color: #d8dee9; font-weight: bold; font-size: 9px;">
            <span>📱 SYSTEM ENGINE LOGS (Galaxy A36 ADAS)</span>
            <button onclick="document.getElementById('mobile-debug-logs').innerHTML=''" style="background: #3b4252; color: #eceff4; border: none; padding: 1px 4px; cursor: pointer; font-size: 8px; border-radius: 2px;">Clear</button>
        </div>
        <div id="mobile-debug-logs"></div>
    </div>

    <div id="control-panel">
        <button id="tracking-btn" class="btn" onclick="toggleTracking()">Launch AI Tracking</button>
        <div id="network-warning" style="font-size: 9px; color: #d8dee9; margin-top: 6px; font-family: monospace; text-align: center;">
            OFFLINE MODE: CONNECT TO BIKE-RADAR-STEM WI-FI | v.4.0.0-LiteRT
        </div>
    </div>
</div>

<script>
    let isTracking = false;
    let pipelineLoopId = null;
    const canvas = document.getElementById('video-canvas');
    const ctx = canvas.getContext('2d');

    let mockVehicleY = 0; 
    let mockVehicleWidth = 40;
    let mockVehicleHeight = 30;
    let previousBox = null;

    (function injectVisualConsole() {
        const logContainer = document.getElementById('mobile-debug-logs');
        
        function appendLog(message, type = 'info') {
            if (!logContainer) return;
            const el = document.createElement('div');
            if (type === 'error') {
                el.style.color = '#bf616a';
                el.style.fontWeight = 'bold';
            } else if (type === 'warn') {
                el.style.color = '#ebcb8b';
            } else {
                el.style.color = '#a3be8c';
            }
            
            const now = new Date();
            const timeStr = `[${now.toTimeString().split(' ')}.${String(now.getMilliseconds()).padStart(3, '0')}]`;
            el.textContent = `${timeStr} ${message}`;
            logContainer.appendChild(el);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;

        console.log = function(...args) { originalLog.apply(console, args); appendLog(args.join(' '), 'info'); };
        console.error = function(...args) { originalError.apply(console, args); appendLog(args.join(' '), 'error'); };
        console.warn = function(...args) { originalWarn.apply(console, args); appendLog(args.join(' '), 'warn'); };

        window.addEventListener('error', (e) => appendLog(`Runtime: ${e.message} at ${e.filename}:${e.lineno}`, 'error'));
        window.addEventListener('unhandledrejection', (e) => appendLog(`Promise Broken: ${e.reason}`, 'error'));
        
        console.log("Visual Pipeline Hooks Engaged.");
    })();

    function resizeCanvas() {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function calculateIoU(boxA, boxB) {
        let xA = Math.max(boxA[0], boxB[0]);
        let yA = Math.max(boxA[1], boxB[1]);
        let xB = Math.min(boxA[2], boxB[2]);
        let yB = Math.min(boxA[3], boxB[3]);

        let interWidth = Math.max(0, xB - xA);
        let interHeight = Math.max(0, yB - yA);
        let interArea = interWidth * interHeight;

        let areaA = (boxA[2] - boxA[0]) * (boxA[3] - boxA[1]);
        let areaB = (boxB[2] - boxB[0]) * (boxB[3] - boxB[1]);

        if ((areaA + areaB - interArea) === 0) return 0;
        return interArea / (areaA + areaB - interArea);
    }

    function estimateTTC(prevBox, currBox, deltaTime = 0.033) {
        if (!prevBox || !currBox) return Infinity;
        let prevHeight = prevBox[3] - prevBox[1];
        let currHeight = currBox[3] - currBox[1];
        if (currHeight <= prevHeight) return Infinity;
        return (prevHeight * deltaTime) / (currHeight - prevHeight);
    }

    function runTrackingLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = '#2e3440';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(canvas.width / 3, canvas.height);
        ctx.lineTo(canvas.width / 2 - 20, canvas.height / 3);
        ctx.moveTo(canvas.width * 2 / 3, canvas.height);
        ctx.lineTo(canvas.width / 2 + 20, canvas.height / 3);
        ctx.stroke();

        mockVehicleY += 2.0; 
        mockVehicleWidth += 0.9;
        mockVehicleHeight += 0.6;

        if (mockVehicleY > canvas.height) {
            mockVehicleY = canvas.height / 5;
            mockVehicleWidth = 35;
            mockVehicleHeight = 25;
            previousBox = null;
        }

        let vehicleX = (canvas.width / 2) - (mockVehicleWidth / 2);
        let currentBox = [vehicleX, mockVehicleY, vehicleX + mockVehicleWidth, mockVehicleY + mockVehicleHeight];

        let currentIoU = 0;
        if (previousBox) { currentIoU = calculateIoU(previousBox, currentBox); }
        let currentTTC = estimateTTC(previousBox, currentBox, 0.033);
        previousBox = currentBox;

        ctx.strokeStyle = currentTTC < 2.0 ? '#bf616a' : '#ebcb8b';
        ctx.lineWidth = 2;
        ctx.strokeRect(vehicleX, mockVehicleY, mockVehicleWidth, mockVehicleHeight);
        
        ctx.fillStyle = ctx.strokeStyle;
        ctx.font = '10px monospace';
        ctx.fillText(`VEHICLE [IoU: ${currentIoU.toFixed(2)}]`, vehicleX, mockVehicleY - 4);

        document.getElementById('hud-target').textContent = "Approaching Node";
        document.getElementById('hud-iou').textContent = currentIoU.toFixed(2);
        document.getElementById('hud-ttc').textContent = currentTTC === Infinity ? "Infinity" : `${currentTTC.toFixed(2)}s`;
        
        let alertBadge = document.getElementById('hud-alert');
        if (currentTTC < 1.5) {
            alertBadge.textContent = "CRITICAL";
            alertBadge.style.color = '#bf616a';
            if (navigator.vibrate) navigator.vibrate(100);
        } else if (currentTTC < 4.0) {
            alertBadge.textContent = "CLOSING";
            alertBadge.style.color = '#ebcb8b';
            if (navigator.vibrate) navigator.vibrate(40);
        } else {
            alertBadge.textContent = "TRACKING";
            alertBadge.style.color = '#a3be8c';
        }

        pipelineLoopId = requestAnimationFrame(runTrackingLoop);
    }

    function toggleTracking() {
        const btn = document.getElementById('tracking-btn');
        if (!isTracking) {
            isTracking = true;
            btn.textContent = "Stop Diagnostics";
            btn.style.background = "#bf616a";
            
            console.log("Connecting directly to ESP32-CAM camera node raw broadcast feed...");
            
            fetch('http://192.168.4.1/stream')
                .then(res => console.log("Camera hardware handshaking active. Ingesting stream pixels."))
                .catch(err => console.error("Camera Fetch Blocked: " + err.message + " (Check IP assignment or Mixed Content Rules)"));

            runTrackingLoop();
        } else {
            isTracking = false;
            btn.textContent = "Launch AI Tracking";
            btn.style.background = "#5e81ac";
            cancelAnimationFrame(pipelineLoopId);
            console.log("Tracking pipeline suspended.");
        }
    }
</script>

</body>
</html>

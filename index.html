<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Bicycle Overtake Radar</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0f">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        #dashboard-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            box-sizing: border-box;
            position: relative;
        }
        #header {
            padding: 12px;
            background: linear-gradient(180deg, rgba(20,20,30,0.8) 0%, rgba(10,10,15,0) 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .status-badge {
            background-color: #155724;
            color: #d4edda;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.5px;
            border: 1px solid #c3e6cb;
        }
        #viewscreen {
            flex: 1;
            background-color: #000000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #stream-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #control-panel {
            padding: 16px;
            background: rgba(15, 15, 25, 0.9);
            border-top: 1px solid #222235;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
            padding-bottom: 200px; /* Buffer space so real-time console overlay doesn't block buttons */
        }
        .btn {
            background: linear-gradient(135deg, #28a745 0%, #218838 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .btn:active {
            transform: scale(0.98);
        }
        /* Telemetry overlay layout styling */
        #telemetry-overlay {
            position: absolute;
            top: 60px;
            left: 12px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            border-left: 3px solid #007bff;
            pointer-events: none;
            display: none;
        }
    </style>
</head>
<body>

    <div id="dashboard-container">
        <!-- TOP NAVIGATION & METRIC RIBBON -->
        <div id="header">
            <h1 style="margin: 0; font-size: 16px; font-weight: 600;">🚲 AI Overtake Radar</h1>
            <span class="status-badge">🟢 OFFLINE MODE</span>
        </div>

        <!-- CAMERA VIEWSCREEN / TARGET CANVAS -->
        <div id="viewscreen">
            <!-- Simulated target placeholder or live MJPEG ESP32 video canvas -->
            <div id="camera-fallback-msg" style="position: absolute; color: #555570; font-size: 14px; text-align: center;">
                Searching for Bicycle Camera Stream...<br>
                <span style="font-size: 11px; color: #3b3b4f;">SSID: Bike-Radar-STEM</span>
            </div>
            <canvas id="stream-canvas"></canvas>
            
            <!-- Dynamic HUD Telemetry Data Display -->
            <div id="telemetry-overlay">
                <div>IoU Match: <span id="telemetry-iou">0.00</span></div>
                <div>TTC Est: <span id="telemetry-ttc">Infinity</span>s</div>
            </div>
        </div>

        <!-- CONTROL PLATFORM INTERFACE -->
        <div id="control-panel">
            <button id="launch-btn" class="btn" onclick="toggleTracking()">Launch AI Tracking</button>
        </div>
    </div>

    <!-- REAL-TIME MOBILE DEBUGGING CONSOLE -->
    <div id="mobile-debug-console" style="
        position: fixed; 
        bottom: 0; 
        left: 0; 
        width: 100%; 
        height: 180px; 
        background: rgba(10, 10, 15, 0.95); 
        color: #00ff66; 
        font-family: monospace; 
        font-size: 11px; 
        overflow-y: auto; 
        z-index: 999999; 
        border-top: 2px solid #ff3333; 
        padding: 8px;
        box-sizing: border-box;
        pointer-events: auto;
    ">
        <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 4px; margin-bottom: 4px; color: #aaa;">
            <span>📱 SYSTEM LOGS (Galaxy A36 ADAS Node)</span>
            <button onclick="document.getElementById('mobile-debug-logs').innerHTML=''" style="background: #333; color: #fff; border: none; padding: 2px 6px; cursor: pointer; font-size: 10px;">Clear</button>
        </div>
        <div id="mobile-debug-logs"></div>
    </div>

    <script>
        // --- VISUAL LOGGING CORNERSTONE SYSTEM ---
        (function() {
            const logContainer = document.getElementById('mobile-debug-logs');
            
            function appendLog(message, type = 'info') {
                const el = document.createElement('div');
                el.style.marginBottom = '4px';
                el.style.wordBreak = 'break-all';
                
                if (type === 'error') {
                    el.style.color = '#ff3333';
                    el.style.fontWeight = 'bold';
                } else if (type === 'warn') {
                    el.style.color = '#ffcc00';
                }
                
                const now = new Date();
                const timeStr = `[${now.toTimeString().split(' ')[0]}.${String(now.getMilliseconds()).padStart(3, '0')}]`;
                
                el.textContent = `${timeStr} ${message}`;
                logContainer.appendChild(el);
                logContainer.scrollTop = logContainer.scrollHeight;
            }

            const originalLog = console.log;
            const originalError = console.error;
            const originalWarn = console.warn;

            console.log = function(...args) {
                originalLog.apply(console, args);
                appendLog(args.join(' '), 'info');
            };

            console.error = function(...args) {
                originalError.apply(console, args);
                appendLog(args.join(' '), 'error');
            };

            console.warn = function(...args) {
                originalWarn.apply(console, args);
                appendLog(args.join(' '), 'warn');
            };

            window.addEventListener('error', function(e) {
                appendLog(`Runtime Exception: ${e.message} at ${e.filename}:${e.lineno}`, 'error');
            });

            window.addEventListener('unhandledrejection', function(e) {
                appendLog(`Unhandled Promise Rejection: ${e.reason}`, 'error');
            });

            console.log("Visual Logger Initialized. Awaiting LiteRT Canvas Pipeline...");
        })();

        // --- GLOBAL APP STATE & KINEMATIC ALGORITHMS ---
        let isTracking = false;
        let trackingInterval = null;
        let simulatedBoxHistory = null;

        function toggleTracking() {
            const btn = document.getElementById('launch-btn');
            const overlay = document.getElementById('telemetry-overlay');
            const fallbackMsg = document.getElementById('camera-fallback-msg');
            
            if (!isTracking) {
                console.log("Initializing LiteRT Runtime Engine...");
                console.log("Configuring pipeline target: WebGPU Acceleration context...");
                
                // Emulating typical mobile hardware optimization check behavior
                setTimeout(() => {
                    console.error("AI ENGINE ERROR: GLES/WebGPU hardware acceleration block detected on target device driver. Falling back to multi-threaded Wasm compilation pipeline.");
                }, 600);

                isTracking = true;
                btn.innerText = "Stop AI Tracking";
                btn.style.background = "linear-gradient(135deg, #dc3545 0%, #bd2130 100%)";
                overlay.style.display = "block";
                if(fallbackMsg) fallbackMsg.style.display = "none";
                
                // Core Execution Pipeline Simulation loop (33ms window frames for ~30 FPS tracking)
                simulatedBoxHistory = [40, 50, 100, 150]; // Static initial template [xMin, yMin, xMax, yMax]
                trackingInterval = setInterval(() => {
                    executeTrackingLoopIteration();
                }, 33);
                
            } else {
                console.log("Stopping edge tracking pipelines safely.");
                isTracking = false;
                btn.innerText = "Launch AI Tracking";
                btn.style.background = "linear-gradient(135deg, #28a745 0%, #218838 100%)";
                overlay.style.display = "none";
                if(fallbackMsg) fallbackMsg.style.display = "block";
                
                clearInterval(trackingInterval);
            }
        }

        function executeTrackingLoopIteration() {
            // Emulate minor box drift and vehicle approaching expansion pattern
            let driftX = (Math.random() - 0.5) * 2;
            let growth = 1.8; // Simulates approaching threat scale enlargement
            
            let nextBox = [
                simulatedBoxHistory[0] + driftX - (growth / 2), // xMin expand outward
                simulatedBoxHistory[1] - growth,               // yMin expand upward
                simulatedBoxHistory[2] + driftX + (growth / 2), // xMax expand outward
                simulatedBoxHistory[3] + growth                // yMax expand downward
            ];

            // Perform calculations
            let iou = calculateIoU(simulatedBoxHistory, nextBox);
            let ttc = estimateTTC(simulatedBoxHistory, nextBox, 0.033);

            // Print updating data metrics to HUD elements
            document.getElementById('telemetry-iou').innerText = iou.toFixed(3);
            document.getElementById('telemetry-ttc').innerText = isFinite(ttc) ? ttc.toFixed(2) : "Infinity";

            // Rotate frames matrix window
            simulatedBoxHistory = nextBox;
        }

        // --- MODULE 3 STUDENT EQUATION VALIDATION TARGETS ---
        function calculateIoU(boxA, boxB) {
            let xA = Math.max(boxA[0], boxB[0]);
            let yA = Math.max(boxA[1], boxB[1]);
            let xB = Math.min(boxA[2], boxB[2]);
            let yB = Math.min(boxA[3], boxB[3]);

            let interWidth = Math.max(0, xB - xA);
            let interHeight = Math.max(0, yB - yA);
            let interArea = interWidth * interHeight;

            let areaA = (boxA[2] - boxA[0]) * (boxA[3] - boxA[1]);
            let areaB = (boxB[2] - boxB[0]) * (boxB[3] - boxB[1]);

            let unionArea = areaA + areaB - interArea;
            if (unionArea <= 0) return 0;
            
            return interArea / unionArea;
        }

        function estimateTTC(previousBox, currentBox, deltaTime = 0.033) {
            let prevHeight = previousBox[3] - previousBox[1];
            let currHeight = currentBox[3] - currentBox[1];

            if (currHeight <= prevHeight) return Infinity; 

            // Kinematic scale-factor change math calculation modeling tracking approaching velocity
            return (prevHeight * deltaTime) / (currHeight - prevHeight);
        }
    </script>
</body>
</html>
